<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CaliSon Café-Bar | Menú</title>
<style>
:root{--bg:#071014;--card:#0c171c;--pink:#ff2aa1;--cyan:#19e8ee;--yellow:#ffd21f;--green:#79ff32;--text:#f7f7f7;--muted:#b8c5c8}
*{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at top,#142b32 0,#071014 35%,#030708 100%);color:var(--text);font-family:Arial,Helvetica,sans-serif}
.wrap{max-width:760px;margin:auto;padding:18px 14px 50px}
header{text-align:center;padding:10px 0 18px}.logo{width:min(330px,86vw);border-radius:22px;box-shadow:0 0 28px #ff2aa155}
.lang{display:flex;gap:10px;justify-content:center;position:sticky;top:8px;z-index:5;margin:10px 0 20px}
.lang button{border:1px solid #ffffff35;background:#081216e8;color:white;padding:11px 20px;border-radius:999px;font-weight:800;backdrop-filter:blur(8px)}
.lang button.active{border-color:var(--cyan);box-shadow:0 0 14px #19e8ee66;color:var(--cyan)}
.card{background:linear-gradient(180deg,#0d181de8,#071013f2);border:1px solid #ffffff20;border-radius:18px;margin:13px 0;padding:16px;box-shadow:0 8px 30px #0008}
.card:nth-of-type(4n+1){border-color:#ffd21f99}.card:nth-of-type(4n+2){border-color:#ff2aa199}.card:nth-of-type(4n+3){border-color:#19e8ee99}.card:nth-of-type(4n){border-color:#79ff3299}
h2{margin:0 0 12px;font-size:1.45rem;color:var(--yellow);text-transform:uppercase}.card:nth-of-type(4n+2) h2{color:var(--pink)}.card:nth-of-type(4n+3) h2{color:var(--cyan)}.card:nth-of-type(4n) h2{color:var(--green)}
.item{display:grid;grid-template-columns:1fr auto;gap:12px;padding:7px 0;border-bottom:1px solid #ffffff12}.item:last-child{border-bottom:0}.price{font-weight:800;white-space:nowrap}.special{color:#ffd21f;font-weight:800}
footer{text-align:center;color:var(--muted);padding-top:24px;font-size:.9rem}
</style>
</head>
<body><div class="wrap">
<header>
<img class="logo" src="logo-calison.jpg" alt="CaliSon Café-Bar">
</header>
<div class="lang">
<button id="esBtn" class="active" onclick="setLang('es')">🇪🇸 Español</button>
